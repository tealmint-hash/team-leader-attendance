<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#11372f">
  <title>관리자 참석 현황</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <main class="admin-shell">
    <header class="admin-header">
      <div><p class="eyebrow">ADMIN DASHBOARD</p><h1>교육 참석 현황</h1><p>교육 회차별 참석 기록을 확인하고 CSV로 내려받을 수 있습니다.</p></div>
      <a href="/">참석 페이지</a>
    </header>
    <section id="login-card" class="card login-card">
      <h2>관리자 확인</h2><p>관리자 암호를 입력해 주세요.</p>
      <form id="login-form"><label for="admin-key">관리자 암호</label><input id="admin-key" type="password" autocomplete="current-password" required><button type="submit">현황 열기</button></form>
    </section>
    <section id="dashboard" class="hidden">
      <div class="event-picker"><label for="event-select">교육 회차</label><select id="event-select"></select><p id="event-note">회차를 바꾸면 해당 교육의 명단과 기록을 불러옵니다.</p></div>
      <div id="summary" class="summary-grid"></div>
      <div class="toolbar">
        <label>검색 <input id="search" type="search" placeholder="이름·본부·권역"></label>
        <label>상태 <select id="filter"><option value="all">전체</option><option value="attending">참석 확인</option><option value="pending">미확인</option></select></label>
        <button id="refresh" type="button">새로고침</button><button id="download" type="button">CSV 다운로드</button>
      </div>
      <div class="table-wrap"><table><thead><tr><th>권역</th><th>본부</th><th>이름</th><th>구분</th><th>상태</th><th>제출 시각</th></tr></thead><tbody id="rows"></tbody></table></div>
    </section>
  </main>
  <div id="toast" class="toast hidden" role="alert"></div>
  <script src="/admin.js" defer></script>
</body>
</html>
